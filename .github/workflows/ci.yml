name: MoonTIN CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.0.0-rc1+3c0520448", "latest"]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        shell: bash
        env:
          MOONBIT_INSTALL_VERSION: ${{ matrix.toolchain }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check source
        run: |
          moon version --all
          moon update
          moon check --target native --warn-list +73
      - name: Run native tests
        run: moon test --target native
      - name: Verify CLI workflows
        run: pwsh -NoProfile -File scripts/test-cli.ps1
      - name: Build Mooncakes archive
        run: moon package
